services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctcd
      POSTGRES_PASSWORD: ctcd
      POSTGRES_DB: ctcd
    ports:
      # Host port 5433 so this can run next to another local Postgres on 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctcd']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
